name: Sync NHL schedule + scores (ESPN)

# Same role as sync-nfl-espn.yml, just for NHL - free, keyless ESPN
# scoreboard, no quota concern. Every 15 min for live-score freshness
# during games; see sync_nhl_espn.py for why this fetches a rolling
# date window instead of the whole season each run.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r python/requirements.txt
      - name: Sync NHL schedule + scores
        working-directory: python
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m cfbd_ingest.sync_nhl_espn
