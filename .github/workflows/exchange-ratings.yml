name: Exchange ratings

# Refits the syndicates' rating systems (margin Elo and two offence/defence ridge regressions) from ESPN final scores for the
# last ~14 months, every few hours. Rounds read the latest fit. Also creates the roster the first time it runs.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: exchange-ratings
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - name: Fit the ratings
        working-directory: python
        env:
          PYTHONUNBUFFERED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m exchange init
          python -m exchange ratings
