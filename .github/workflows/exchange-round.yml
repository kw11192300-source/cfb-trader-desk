name: Exchange round

# One round of the paper-only Syndicates exchange (python/exchange): pull ESPN's DraftKings lines and scores, settle finished games,
# let the makers quote and the takers trade, and mark everyone to market. A cron-job.org job dispatches it every 5 minutes (GitHub's own
# schedule below is only a backstop and can lag); the engine scales everything that was tuned per round by the real time since the last
# one, so the spacing can change without changing how the exchange behaves. Or start it by hand from the Actions tab.
on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: exchange
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - name: Paper-only audit
        working-directory: python
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m exchange audit
      - name: Run a round
        working-directory: python
        env:
          PYTHONUNBUFFERED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m exchange round
