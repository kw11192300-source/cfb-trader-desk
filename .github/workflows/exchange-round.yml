name: Exchange round

# One round of the paper-only Syndicates exchange (python/exchange): pull ESPN's DraftKings lines and scores, settle finished games,
# let the makers quote and the takers trade, and mark everyone to market. GitHub's scheduler runs this when it can (about every 10
# minutes; it can lag under load) - or start it by hand from the Actions tab.
on:
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: exchange
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - name: Run a round
        working-directory: python
        env:
          PYTHONUNBUFFERED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m exchange round
