name: NBA in-season ratings

# Pulls the NBA games that finished this season (ESPN box scores + play-by-play), rebuilds this season's lineup stints, refits every
# player's offence / defence rating on top of the 2021-25 history (python/models/nba_history) and republishes the Players page.
# Dispatched by /api/cron/nba-ratings (cron-job.org, once or twice a day) or by hand from the Actions tab.
#
# The season's raw files are cached between runs, so a run only downloads games played since the last one.
on:
  workflow_dispatch: {}

concurrency:
  group: nba-ratings
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r python/requirements.txt
      - name: Restore this season's raw games
        uses: actions/cache@v4
        with:
          path: |
            python/data/nba/raw/scoreboard
            python/data/nba/raw/games
            python/data/nba/raw/pbp
            python/data/nba/schedule.csv
          key: nba-season-${{ github.run_id }}
          restore-keys: nba-season-
      - name: Refit ratings from results
        working-directory: python
        env:
          PYTHONUNBUFFERED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m nba_model.inseason
