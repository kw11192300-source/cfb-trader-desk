name: In-season watchlist (discovery)

# Exploratory second signal - see modeling/watchlist.py's module docstring.
# This is the SLOW half only (new-candidate discovery: full model retrain
# + build_live_features() pass) - see refresh-watchlist.yml for the fast,
# frequent confirmation check against the current line (same split as
# predict-week1.yml/refresh-edges.yml). Unlike that pair, there's no
# external API quota to protect here (Supabase reads + a local model
# train only) and this repo is public, so Actions minutes are free -
# every hour instead of predict-week1.yml's 4h, so a freshly-posted line
# (e.g. next week's openers) gets a candidate discovered within an hour
# instead of sitting unseen for up to 4.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  watchlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r python/requirements.txt
      - name: Scan for candidates + confirmed alerts
        working-directory: python
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m modeling.watchlist
