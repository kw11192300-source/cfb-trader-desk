name: In-season watchlist

# Exploratory second signal - see modeling/watchlist.py's module docstring.
# Retrains the margin model each run (unlike refresh-edges.yml's fast
# no-retrain check) since it needs a fresh build_live_features() pass
# anyway - every 2h matches predict-week1.yml's own cadence, a reasonable
# cost/benefit given lines don't move meaningfully faster than that for
# most of the week. Reads Supabase only, no CFBD/Odds API calls.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  watchlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r python/requirements.txt
      - name: Scan for candidates + confirmed alerts
        working-directory: python
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m modeling.watchlist
