name: In-season watchlist (discovery)

# Exploratory second signal - see modeling/watchlist.py's module docstring.
# This is the SLOW half only (new-candidate discovery: full model retrain
# + build_live_features() pass) - see refresh-watchlist.yml for the fast,
# frequent confirmation check against the current line (same split as
# predict-week1.yml/refresh-edges.yml, and for the same reason: team
# ratings barely move hour to hour, so there's no need to pay for a full
# retrain just to check whether a line moved). Every 4h matches
# predict-week1.yml's own cadence. Reads Supabase only, no CFBD/Odds API
# calls.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  watchlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r python/requirements.txt
      - name: Scan for candidates + confirmed alerts
        working-directory: python
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m modeling.watchlist
