name: NBA live projections

# Projected minutes, stat lines and the injury "news move" for the NBA games coming up (python/nba_model/live_run.py).
# Started by the ~10-minute NBA timer (src/lib/nbaLive.ts) whenever the official injury report changes, or by hand from the Actions tab.
# Reads the raw box scores cached by the "NBA in-season ratings" job (restore only, so it never writes the cache; the path list must
# match that job's exactly or the cache version differs and nothing restores).
on:
  workflow_dispatch: {}

concurrency:
  group: nba-live
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      - name: Restore this season's raw games
        uses: actions/cache/restore@v4
        with:
          path: |
            python/data/nba/raw/scoreboard
            python/data/nba/raw/games
            python/data/nba/raw/pbp
            python/data/nba/schedule.csv
          key: nba-live-${{ github.run_id }}
          restore-keys: nba-season-
      - name: Project the games on the board
        working-directory: python
        env:
          PYTHONUNBUFFERED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m nba_model.live_run
